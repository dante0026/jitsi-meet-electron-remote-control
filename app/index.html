<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        body, html {
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // Render the Launcher window entry point once the bundle is loaded.
        window.addEventListener('load', function() {
            window.renderEntryPoint('APP');
        });
    </script>
</body>
</html>
